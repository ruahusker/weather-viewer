<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WxViewer</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WxViewer">
  <meta name="theme-color" content="#050916">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">

  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css?v=1.9.4">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="stylesheet" href="/static/css/tokens.css?v=20260930e">
  <link rel="stylesheet" href="/static/css/mobile.css?v=20260610a">
  <link rel="stylesheet" href="/static/css/surface-obs.css?v=20260330b">
  <link rel="stylesheet" href="/static/css/mobile-refresh.css?v=20261008g">
  <link rel="stylesheet" href="/static/css/pressure-contours.css?v=20261008d">
  <!-- v4 interface is the default; ?ui=classic switches back (remembered), ?ui=v4 returns. -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('ui');
        if (q === 'v4' || q === 'classic') localStorage.setItem('wx_ui', q);
        if ((q || localStorage.getItem('wx_ui')) !== 'classic') document.documentElement.dataset.ui = 'v4';
      } catch (e) { document.documentElement.dataset.ui = 'v4'; }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/mobile-v4.css?v=20261017b">
</head>
<body>
  <!-- Map (full viewport) -->
  <div id="map"></div>

  <!-- Top bar: logo left, info center, share right -->
  <div class="top-bar">
    <div class="top-logo">
      <img src="/static/brand/wx-mark.svg" alt="" />
      <span>WX<span class="logo-accent">VIEWER</span></span>
    </div>
    <span id="topInfo" class="top-info"></span>
    <div class="top-right">
      <span id="topValue" class="top-value"></span>
      <button id="spcToggle" class="top-btn" aria-label="SPC Outlooks">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20h12"/><path d="M8 20v-2a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><rect x="9" y="8" width="6" height="8" rx="3"/><path d="M12 3v2"/><path d="M5 8l1.5 1"/><path d="M17.5 9L19 8"/><path d="M4 13h2"/><path d="M18 13h2"/></svg>
      </button>
      <button id="chaserToggle" class="top-btn" aria-label="Storm Chasers">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4c3-1 7 0 10 2"/><path d="M9 6c2 2 1 5-1 8s-2 5-1 7"/><path d="M14 7c1 2 1 5 0 7s-2 4-3 6"/><path d="M17 6c0 3-1 6-3 8"/></svg>
      </button>
      <button id="screenshotBtn" class="top-btn" aria-label="Screenshot">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M12 7h.01"/></svg>
      </button>
      <button id="shareBtn" class="top-btn" aria-label="Share">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </div>
  </div>

  <!-- Floating selector pill -->
  <button id="selectorPill" class="selector-pill" aria-label="Select product">
    <span id="pillLabel">Radar</span>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>

  <!-- Legend bar -->
  <div id="legendBar" class="legend-bar hidden">
    <div id="legendLabel" class="legend-label"></div>
    <canvas id="legendCanvas" width="240" height="12"></canvas>
    <div id="legendTicks" class="legend-ticks"></div>
    <div id="legendNote" class="legend-note"></div>
  </div>

  <!-- Scrubber -->
  <div id="scrubber" class="scrubber">
    <div class="scrub-controls">
      <button id="playBtn" class="scrub-btn" aria-label="Play">
        <svg id="playIcon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><polygon points="5,3 17,10 5,17"/></svg>
        <svg id="pauseIcon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor" class="hidden"><rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/></svg>
      </button>
      <input id="scrubSlider" aria-label="Weather animation frame" type="range" min="0" max="0" value="0" class="scrub-slider">
      <button id="speedBtn" class="speed-btn">1x</button>
    </div>
    <div class="scrub-info">
      <span id="scrubLabel" class="scrub-valid-time">--</span>
      <span id="scrubFrameCount" class="scrub-frame-count">--</span>
    </div>
  </div>

  <!-- Tab bar -->
  <nav id="tabBar" class="tab-bar">
    <a class="radar-map-link" href="/wx/radar-map-3d" aria-label="Live 3D radar map" style="text-decoration:none;color:inherit;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;padding:9px 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 3 8v9l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v9"/></svg>
      <span>3D Radar</span>
    </a>
    <button class="tab active" data-tab="radar" aria-label="Radar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 12l-7-7"/><path d="M12 12a3 3 0 0 0-3-3"/><path d="M12 12a7 7 0 0 0-7-7"/></svg>
      <span>Radar</span>
    </button>
    <button class="tab" data-tab="surface" aria-label="Surface">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="4"/></svg>
      <span>Surface</span>
    </button>
    <button class="tab" data-tab="models" aria-label="Models">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
      <span>Models</span>
    </button>
    <button class="tab" data-tab="satellite" aria-label="Satellite">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="8" stroke-dasharray="4 3"/></svg>
      <span>Satellite</span>
    </button>
  </nav>

  <!-- Bottom sheet backdrop -->
  <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>

  <!-- Bottom sheet -->
  <div id="bottomSheet" class="bottom-sheet hidden" role="dialog" aria-label="Choose weather products">
    <div class="sheet-handle"><div class="handle-bar"></div></div>
    <div id="sheetContent" class="sheet-content"></div>
  </div>

  <!-- Share action sheet -->
  <div id="shareSheet" class="share-sheet hidden">
    <div class="share-sheet-inner">
      <button id="shareCopyLink" class="share-option">Copy Link</button>
      <button id="shareNative" class="share-option">Share...</button>
      <a href="?view=desktop" data-desktop-link class="share-option">Desktop Version</a>
      <button id="shareCancel" class="share-option cancel">Cancel</button>
    </div>
  </div>

  <!-- Sounding panel (slide-up) -->
  <div id="soundingPanel" class="sounding-panel hidden">
    <div class="sounding-header">
      <div>
        <div id="soundingTitle" class="sounding-title"></div>
        <div id="soundingMeta" class="sounding-meta"></div>
      </div>
      <button id="soundingClose" class="top-btn" aria-label="Close sounding">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sounding-body">
      <div id="soundingStatus" class="sounding-status hidden"></div>
      <div id="soundingChartBox" class="sounding-chart-box"></div>
      <div id="soundingHodoBox" class="sounding-hodo-box"></div>
      <div id="soundingDiagBox" class="sounding-diag-box"></div>
    </div>
  </div>

  <footer class="mobile-view-footer">
    <a href="?view=desktop" data-desktop-link>Switch to desktop view</a>
  </footer>

  <script src="/static/vendor/leaflet/leaflet.js?v=1.9.4"></script>
  <script src="/static/js/pressure-contours.js?v=20261008f"></script>
  <script src="/static/js/map-capture.js?v=20261008e"></script>
  <script src="/static/js/viewer-ui.js?v=20261008g"></script>
  <script src="/static/js/mobile-sounding.js?v=43"></script>
  <script src="/static/js/surface-obs.js?v=20261014a"></script>
  <script src="/static/js/mobile.js?v=20261014a"></script>
  <script src="/static/js/mobile-ui-v4.js?v=20261017a"></script>
</body>
</html>
