<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar 3D Render</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/wx-mark.svg" />
  <link rel="stylesheet" href="/static/css/tokens.css?v=20260610a" />
  <link rel="stylesheet" href="/static/css/radar3d.css?v=20260610a" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="radar3d-shell">
    <aside class="radar3d-panel">
      <div class="radar3d-brand">
        <img src="/static/brand/wx-mark.svg" alt="" />
        <div>
          <div class="radar3d-kicker">NEXRAD Level II</div>
          <h1 class="radar3d-title">3D Radar Render</h1>
        </div>
      </div>
      <div id="radar3dStatus" class="radar3d-status">Loading latest volume...</div>

      <div class="radar3d-meta" id="radar3dMeta">
        <div class="radar3d-meta-row"><span>Site</span><strong id="metaSite">--</strong></div>
        <div class="radar3d-meta-row"><span>Scan</span><strong id="metaScan">--</strong></div>
        <div class="radar3d-meta-row"><span>Tilts</span><strong id="metaTilts">--</strong></div>
        <div class="radar3d-meta-row"><span>Max dBZ</span><strong id="metaDbz">--</strong></div>
        <div class="radar3d-meta-row"><span>Top</span><strong id="metaTop">--</strong></div>
      </div>

      <div class="radar3d-controls">
        <label class="radar3d-control">
          <span>Vertical Exaggeration</span>
          <input id="heightScale" type="range" min="0.8" max="2.8" step="0.1" value="1.4" />
        </label>
        <label class="radar3d-control">
          <span>Low dBZ Opacity</span>
          <input id="hazeOpacity" type="range" min="0.05" max="0.5" step="0.01" value="0.18" />
        </label>
        <label class="radar3d-control">
          <span>Core Contrast</span>
          <input id="coreScale" type="range" min="0.5" max="2.0" step="0.05" value="1.0" />
        </label>
      </div>

      <div class="radar3d-actions">
        <button id="presetOblique" type="button">Oblique</button>
        <button id="presetTop" type="button">Top</button>
        <button id="presetInflow" type="button">Inflow</button>
        <button id="refreshVolume" type="button">Reload Scan</button>
      </div>

      <div class="radar3d-note">
        Uses the latest full Level II tilt stack for the selected radar site and renders it independently of the 2D map.
      </div>
    </aside>

    <main class="radar3d-stage">
      <div id="radar3dViewport" class="radar3d-viewport"></div>
    </main>
  </div>

  <script>
    window.WX_BASE = window.location.pathname.replace(/\/radar-3d$/, '');
  </script>
  <script type="module" src="/static/js/radar3d.js"></script>
</body>
</html>
