<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">WX Viewer mark</title>
  <desc id="desc">A broadcast-weather radar mark with a storm core and scan arcs.</desc>
  <defs>
    <linearGradient id="wx-bg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b78ff"/>
      <stop offset="0.45" stop-color="#52d7ff"/>
      <stop offset="1" stop-color="#ffcc66"/>
    </linearGradient>
    <linearGradient id="wx-core" x1="18" y1="18" x2="45" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#9beaff"/>
      <stop offset="1" stop-color="#6c5cff"/>
    </linearGradient>
    <filter id="wx-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#07111f"/>
  <path d="M9 45c7 7 17 10 28 8 8-1 14-5 19-10" fill="none" stroke="#19304d" stroke-width="1.4" opacity="0.9"/>
  <path d="M7 21c10-7 23-9 36-5 5 2 10 5 14 8" fill="none" stroke="#19304d" stroke-width="1.4" opacity="0.9"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#wx-bg)" stroke-width="2.1" opacity="0.92"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#52d7ff" stroke-width="1.4" opacity="0.42"/>
  <path d="M32 8v8M32 48v8M8 32h8M48 32h8" stroke="#52d7ff" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <path d="M13 43c8-1 14-5 18-12 4-8 10-12 20-12-4 9-10 14-18 16-8 2-12 5-20 8Z" fill="url(#wx-core)" filter="url(#wx-glow)"/>
  <path d="M16 41c6-1 11-5 15-12 4 5 8 7 15 7-4 4-9 7-15 8-6 1-10 0-15-3Z" fill="#07111f" opacity="0.72"/>
  <path d="M20 38c5-2 8-5 11-10 3 4 7 6 12 6-4 3-8 5-13 6-4 0-7 0-10-2Z" fill="#ffcc66" opacity="0.95"/>
</svg>
