[Service]
# Use independent hours for throughput, splitting only into spare CPU capacity.
Environment="SHARED_RENDER_WORKERS=8"
Environment="AFFINITY_POOL_A_WORKERS=3"
Environment="AFFINITY_POOL_B_WORKERS=3"
Environment="AFFINITY_POOL_C_WORKERS=2"
Environment="MODEL_MAX_CPU_CORES=10"
Environment="MODEL_CPU_RESERVE_CORES=0.5"
Environment="MODEL_WORKING_MEMORY_MB=20480"
Environment="MODEL_HOST_RESERVE_MB=4096"
Environment="MODEL_HEIGHT_CACHE_MB=128"
Environment="MODEL_GEOMETRY_CACHE_MB=256"
Environment="BURST_RENDER_MAX_SUBWORKERS=4"
Environment="AFFINITY_POOL_BURST_SUBWORKERS=4"
Environment="BURST_RENDER_MAX_CPU_PCT=95"
Environment="BURST_RENDER_MODELS=hrrr,nam3km,rap,gfs,ecmwf,nam12km,gdps,rrfs"
CPUWeight=200
MemoryHigh=22G
MemoryMax=24G
