[Service]
# Four forecast-hour jobs can use at most eight rendering children.
# Leave CPU time and host memory for radar, satellite, API, and other services.
Environment="SHARED_RENDER_WORKERS=4"
Environment="AFFINITY_POOL_A_WORKERS=2"
Environment="AFFINITY_POOL_B_WORKERS=1"
Environment="AFFINITY_POOL_C_WORKERS=1"
Environment="BURST_RENDER_ENABLED=1"
Environment="BURST_RENDER_MAX_SUBWORKERS=2"
Environment="AFFINITY_POOL_BURST_SUBWORKERS=2"
Environment="BURST_RENDER_MAX_CPU_PCT=80"
Environment="BURST_RENDER_MAX_MEM_PCT=80"
Environment="BURST_RENDER_MEMORY_FACTOR=2.25"
Environment="MODEL_HOST_RESERVE_MB=4096"
MemoryHigh=12G
MemoryMax=14G
