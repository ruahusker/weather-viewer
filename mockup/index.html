<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WX Viewer</title>
<meta name="description" content="A clean mockup of WX Viewer. Sample weather fields on a continental map.">
<style>
@font-face {
  font-family: "Familjen Grotesk";
  src: url("fonts/familjen-400.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Familjen Grotesk";
  src: url("fonts/familjen-500.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Familjen Grotesk";
  src: url("fonts/familjen-600.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Spline Sans Mono";
  src: url("fonts/spline-400.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Spline Sans Mono";
  src: url("fonts/spline-500.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

:root {
  --field: #e4e8e3;
  --sheet: #f3f5f2;
  --ink: #1b2823;
  --muted: #5c6a63;
  --faint: #66736c;
  --line: #d0d6d1;
  --line-strong: #b7c0ba;
  --bronze: #6e4f32;
  --chart: #f4f1e8;
  --neighbor: #d7dbd4;
  --water: #d5e2e3;
  --lake: #c9dadc;
  --danger: #a32020;
  --sans: "Familjen Grotesk", "Segoe UI", sans-serif;
  --mono: "Spline Sans Mono", ui-monospace, monospace;
  --shadow: 0 12px 32px rgba(27, 40, 35, 0.1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--field);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.4;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color-scheme: light;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
[hidden] { display: none !important; }

.rail {
  flex: none;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  height: 56px;
  padding: 0 16px 0 14px;
  background: var(--sheet);
  border-bottom: 1px solid var(--line);
  user-select: none;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { display: block; color: var(--ink); }
.brand h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1;
}
.brand h1 span { font-weight: 500; color: var(--muted); margin-left: 1px; }
.tabs { display: flex; gap: 2px; margin-left: 22px; }
.tabs button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-weight: 500;
  font-size: 14.5px;
  padding: 8px 12px 10px;
  border-radius: 4px;
}
.tabs button[aria-selected="true"] {
  color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--bronze);
}
.tabs button:hover { color: var(--ink); }
.rail-meta { display: flex; align-items: center; gap: 16px; }
.live { text-align: right; min-width: 108px; }
.live strong {
  display: block;
  font-family: var(--mono);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.live span { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; }
.warn-chip, .sheet-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1;
}
.warn-chip i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--danger);
  flex: none;
}
.sheet-toggle { display: none; }

.stage {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
}
.sheet {
  background: var(--sheet);
  border-right: 1px solid var(--line);
  overflow: auto;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.panel { padding: 18px 16px 32px; }
.panel h2 {
  margin: 22px 0 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.panel h2:first-child { margin-top: 2px; }
.note { margin: 0; font-size: 14.5px; font-weight: 500; }

.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 11px 2px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  font-size: 14.5px;
  font-weight: 500;
}
.switch i {
  width: 32px;
  height: 18px;
  border-radius: 99px;
  background: #c5ccc6;
  position: relative;
  flex: none;
}
.switch i::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(27, 40, 35, 0.28);
  transition: transform 0.15s ease;
}
.switch[aria-pressed="true"] i { background: var(--bronze); }
.switch[aria-pressed="true"] i::after { transform: translateX(14px); }

.warnings { list-style: none; margin: 0; padding: 0; }
.warning {
  display: block;
  width: 100%;
  position: relative;
  padding: 9px 8px 9px 16px;
  background: none;
  border: 0;
  border-radius: 4px;
  text-align: left;
}
.warning::before {
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c, var(--danger));
}
.warning b { display: block; font-weight: 600; font-size: 14px; }
.warning span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
.warning:hover, .warning[aria-current="true"] { background: #e7ebe4; }
.warning.is-expired { opacity: 0.55; }
.empty-note { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

select, .search {
  width: 100%;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: transparent;
  padding: 0 10px;
}
select {
  appearance: none;
  padding-right: 28px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%235C6A63' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
}
.search { margin-bottom: 8px; }
.search::placeholder { color: var(--faint); }
.choice {
  display: block;
  width: 100%;
  text-align: left;
  padding: 7px 10px 7px 12px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  font-size: 14.5px;
  font-weight: 500;
}
.choice:hover { background: #e7ebe4; }
.choice[aria-pressed="true"] {
  background: #e4e8e1;
  box-shadow: inset 2px 0 0 var(--bronze);
}
.segment {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.segment button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 8px 4px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}
.segment button + button { border-left: 1px solid var(--line); }
.segment button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.disclosure {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-top: 14px;
  padding: 12px 2px 8px;
  background: none;
  border: 0;
  border-top: 1px solid var(--line);
  font-size: 14.5px;
  font-weight: 500;
  text-align: left;
}
.disclosure .chev {
  width: 6px;
  height: 6px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: rotate(-45deg);
  margin-top: -3px;
}
.disclosure[aria-expanded="true"] .chev { transform: rotate(45deg); margin-top: 2px; }
.miss { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

.map {
  position: relative;
  min-width: 0;
  background: var(--water);
  overflow: hidden;
  user-select: none;
}
#chart { display: block; width: 100%; height: 100%; cursor: crosshair; }
.water { fill: var(--water); }
.neighbor { fill: var(--neighbor); }
.land { fill: var(--chart); }
.lake { fill: var(--lake); }
.state-line { fill: none; stroke: rgba(27, 40, 35, 0.2); stroke-width: 1; vector-effect: non-scaling-stroke; }
.warning-shape, .range-ring, .front-line { vector-effect: non-scaling-stroke; }
.map.is-satellite { background: #121a1c; }
.map.is-satellite .water,
.map.is-satellite .lake { fill: #121a1c; }
.map.is-satellite .neighbor,
.map.is-satellite .land { fill: #1c2628; }
.map.is-satellite .state-line { stroke: rgba(214, 226, 223, 0.32); }

.plate {
  position: absolute;
  left: 22px;
  bottom: 92px;
  pointer-events: none;
}
.plate-time {
  font-family: var(--mono);
  font-weight: 500;
  font-size: clamp(26px, 2.5vw, 34px);
  letter-spacing: -0.04em;
  color: var(--bronze);
  line-height: 1;
  text-shadow: 0 1px 0 rgba(244, 241, 232, 0.95), 0 0 14px rgba(244, 241, 232, 0.9);
}
.plate-time span {
  margin-left: 6px;
  font-size: 0.42em;
  letter-spacing: 0.08em;
  vertical-align: 0.45em;
}
.plate-caption {
  margin-top: 6px;
  font-size: 13.5px;
  font-weight: 500;
  text-shadow: 0 1px 0 rgba(244, 241, 232, 0.95);
}
.map.is-satellite .plate-time { color: #e6d3b8; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
.map.is-satellite .plate-caption { color: #d5ddd8; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }

.timebar {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 16px;
  height: 58px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 0 14px 0 10px;
  background: rgba(243, 245, 242, 0.94);
  border: 1px solid var(--line);
  border-radius: 8px;
  backdrop-filter: blur(10px);
}
.play {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: var(--ink);
  color: var(--sheet);
  display: grid;
  place-items: center;
  padding: 0;
}
.play svg { display: block; }
.track { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.track input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 16px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.track input[type="range"]:focus-visible { outline-offset: 4px; }
.track input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  background: linear-gradient(90deg, var(--bronze) var(--p, 100%), var(--line-strong) var(--p, 100%));
}
.track input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -5px;
  border: 0;
  border-radius: 50%;
  background: var(--bronze);
}
.track input[type="range"]::-moz-range-track { height: 2px; background: var(--line-strong); border: 0; }
.track input[type="range"]::-moz-range-progress { height: 2px; background: var(--bronze); }
.track input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 0;
  border-radius: 50%;
  background: var(--bronze);
}
.track-labels {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  line-height: 1;
}
.legend { display: flex; align-items: center; gap: 8px; }
.legend span {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  white-space: nowrap;
}
.legend i {
  display: block;
  width: 92px;
  height: 8px;
  border-radius: 2px;
  background: var(--bar, #ccc);
}
.legend.is-plain i { display: none; }

.pin {
  position: absolute;
  width: 214px;
  padding: 12px 28px 12px 14px;
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  z-index: 3;
}
.pin-close {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 24px;
  height: 24px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}
.pin-place { font-weight: 600; font-size: 14.5px; }
.pin-coord {
  margin-top: 2px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}
.pin-hero { margin-top: 8px; line-height: 1; }
.pin-hero strong {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -0.04em;
  color: var(--bronze);
}
.pin-hero span { margin-left: 4px; color: var(--muted); font-size: 12px; }
.pin-meta { margin-top: 8px; font-size: 13px; color: var(--ink); }
.pin-meta div + div { margin-top: 2px; }

.scrim {
  display: none;
  position: absolute;
  inset: 0;
  border: 0;
  background: rgba(27, 40, 35, 0.18);
  z-index: 4;
}

@media (max-width: 860px) {
  .rail {
    height: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 10px 12px 0;
  }
  .tabs {
    order: 5;
    width: 100%;
    margin: 4px 0 0;
    overflow-x: auto;
  }
  .sheet-toggle { display: inline-flex; }
  .live { min-width: 0; }
  .live span { display: none; }
  .stage { display: block; position: relative; }
  .map { position: absolute; inset: 0; }
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    max-height: 62%;
    border-right: 0;
    border-top: 1px solid var(--line);
    transform: translateY(105%);
    transition: transform 0.22s ease;
    background: var(--sheet);
  }
  .stage.sheet-open .sheet { transform: translateY(0); }
  .stage.sheet-open .scrim { display: block; }
  .plate { left: 14px; bottom: 84px; }
  .timebar { left: 8px; right: 8px; bottom: 8px; gap: 8px; padding-right: 10px; }
  .legend span { display: none; }
  .legend i { width: 64px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header class="rail">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 12 L18.2 7.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
    </svg>
    <h1>WX <span>Viewer</span></h1>
  </div>
  <nav class="tabs" role="tablist" aria-label="Source">
    <button type="button" role="tab" id="tab-now" data-mode="now" aria-selected="true" aria-controls="sheet">Now</button>
    <button type="button" role="tab" id="tab-radar" data-mode="radar" aria-selected="false" aria-controls="sheet" tabindex="-1">Radar</button>
    <button type="button" role="tab" id="tab-models" data-mode="models" aria-selected="false" aria-controls="sheet" tabindex="-1">Models</button>
    <button type="button" role="tab" id="tab-satellite" data-mode="satellite" aria-selected="false" aria-controls="sheet" tabindex="-1">Satellite</button>
  </nav>
  <div class="rail-meta">
    <div class="live">
      <strong id="liveValue">—</strong>
      <span id="livePlace">—</span>
    </div>
    <button type="button" class="warn-chip" id="warnChip"><i></i><span>3 warnings</span></button>
    <button type="button" class="sheet-toggle" id="sheetToggle" aria-expanded="false" aria-controls="sheet">Fields</button>
  </div>
</header>

<main class="stage" id="stage">
  <aside class="sheet" id="sheet">
    <section class="panel" data-panel="now">
      <h2>Showing</h2>
      <button type="button" class="switch" data-layer="radar" aria-pressed="true"><span>Composite radar</span><i></i></button>
      <button type="button" class="switch" data-layer="warnings" aria-pressed="true"><span>Warnings</span><i></i></button>
      <button type="button" class="switch" data-layer="stations" aria-pressed="false"><span>Surface stations</span><i></i></button>
      <button type="button" class="switch" data-layer="outlook" aria-pressed="false"><span>Day 1 outlook</span><i></i></button>
      <h2>In view</h2>
      <ul class="warnings" id="warningList"></ul>
    </section>

    <section class="panel" data-panel="radar" hidden>
      <h2>Station</h2>
      <select id="siteSelect" aria-label="Radar station">
        <option value="KICT">KICT · Wichita</option>
        <option value="KTLX">KTLX · Oklahoma City</option>
        <option value="KTWX">KTWX · Topeka</option>
        <option value="KEAX">KEAX · Kansas City</option>
        <option value="KOAX">KOAX · Omaha</option>
        <option value="KDDC">KDDC · Dodge City</option>
      </select>
      <h2>Product</h2>
      <div class="choices">
        <button type="button" class="choice" data-radar="reflectivity" aria-pressed="true">Reflectivity</button>
        <button type="button" class="choice" data-radar="velocity">Velocity</button>
      </div>
      <h2>Elevation</h2>
      <div class="segment" id="tiltSeg">
        <button type="button" data-tilt="0.5" aria-pressed="true">0.5°</button>
        <button type="button" data-tilt="0.9" aria-pressed="false">0.9°</button>
        <button type="button" data-tilt="1.3" aria-pressed="false">1.3°</button>
      </div>
      <h2>Loop</h2>
      <div class="segment" id="loopSeg">
        <button type="button" data-loop="30" aria-pressed="false">30 min</button>
        <button type="button" data-loop="60" aria-pressed="false">1 hour</button>
        <button type="button" data-loop="120" aria-pressed="true">2 hours</button>
      </div>
    </section>

    <section class="panel" data-panel="models" hidden>
      <h2>Model</h2>
      <select id="modelSelect" aria-label="Model">
        <option value="hrrr">HRRR</option>
        <option value="nam">NAM 3 km</option>
        <option value="rap">RAP</option>
        <option value="gfs">GFS</option>
        <option value="ecmwf">ECMWF</option>
      </select>
      <h2>Run</h2>
      <select id="runSelect" aria-label="Model run">
        <option value="12">14 Oct · 12Z</option>
        <option value="6">14 Oct · 06Z</option>
        <option value="0">14 Oct · 00Z</option>
      </select>
      <h2>Field</h2>
      <input class="search" id="fieldSearch" type="search" placeholder="Find a field" aria-label="Find a field" autocomplete="off" spellcheck="false">
      <div class="choices" id="modelFields">
        <button type="button" class="choice" data-field="reflectivity" aria-pressed="true">Reflectivity</button>
        <button type="button" class="choice" data-field="temperature">Temperature</button>
        <button type="button" class="choice" data-field="dewpoint">Dewpoint</button>
        <button type="button" class="choice" data-field="wind">Wind</button>
        <button type="button" class="choice" data-field="cape">CAPE</button>
        <button type="button" class="choice" data-field="precip">Precipitation</button>
        <button type="button" class="choice" data-field="pressure">Pressure</button>
      </div>
      <button type="button" class="disclosure" id="chaseToggle" aria-expanded="false" aria-controls="chaseFields">
        <span class="chev" aria-hidden="true"></span> Chase indices
      </button>
      <div class="choices" id="chaseFields" hidden>
        <button type="button" class="choice" data-field="target">Target index</button>
        <button type="button" class="choice" data-field="meso">Mesocyclone strength</button>
        <button type="button" class="choice" data-field="mode">Storm mode</button>
        <button type="button" class="choice" data-field="visibility">Visibility</button>
      </div>
      <p class="miss" id="fieldEmpty" hidden>Nothing matches that name.</p>
    </section>

    <section class="panel" data-panel="satellite" hidden>
      <h2>Satellite</h2>
      <p class="note">GOES-19 East</p>
      <h2>Product</h2>
      <div class="choices">
        <button type="button" class="choice" data-sat="ir" aria-pressed="true">Infrared</button>
        <button type="button" class="choice" data-sat="wv">Water vapor</button>
        <button type="button" class="choice" data-sat="vis">Visible</button>
      </div>
      <h2>Domain</h2>
      <div class="segment" id="domainSeg">
        <button type="button" data-domain="conus" aria-pressed="true">CONUS</button>
        <button type="button" data-domain="meso" aria-pressed="false">Mesoscale</button>
      </div>
    </section>
  </aside>

  <div class="map" id="map">
    <svg id="chart" role="img" aria-label="Weather map of the continental United States"></svg>
    <div class="plate">
      <div class="plate-time" id="plateTime">18:00<span>UTC</span></div>
      <div class="plate-caption" id="plateCaption"></div>
    </div>

    const bx = ux * along, by = uy * along;
    g.appendChild(el('path', {
      d: 'M' + bx.toFixed(1) + ' ' + by.toFixed(1) + ' L' + (bx + pxr * barb * 0.55).toFixed(1) + ' ' + (by + pyr * barb * 0.55).toFixed(1),
      stroke: color, 'stroke-width': 1.15, 'vector-effect': 'non-scaling-stroke'
    }));
  }
  parent.appendChild(g);
}

function clock(min) {
  let day = 14;
  let m = min + 12 * 60;
  while (m < 0) { m += 1440; day -= 1; }
  while (m >= 1440) { m -= 1440; day += 1; }
  return { day: day, hh: String(Math.floor(m / 60)).padStart(2, '0'), mm: String(m % 60).padStart(2, '0') };
}
function timeline() {
  if (state.mode === 'models') {
    const start = (state.runHour - 12) * 60;
    return Array.from({ length: 19 }, function (_, h) { return start + h * 60; });
  }
  const count = state.mode === 'radar' ? { 30: 3, 60: 5, 120: 9 }[state.loop] : 9;
  return Array.from({ length: count }, function (_, i) { return 360 - (count - 1 - i) * 15; });
}
function snapValid() {
  const times = timeline();
  if (times.indexOf(state.validMinute) !== -1) return;
  let best = times[times.length - 1];
  let score = 1e9;
  times.forEach(function (t) {
    const d = Math.abs(t - state.validMinute);
    if (d < score) { score = d; best = t; }
  });
  state.validMinute = best;
}
function placeName(lon, lat) {
  let best = null;
  let bestD = 1e9;
  for (let i = 0; i < CITIES.length; i++) {
    const d = distKm(lon, lat, CITIES[i][1], CITIES[i][2]);
    if (d < bestD) { bestD = d; best = CITIES[i]; }
  }
  return best && bestD < 145 ? best[0] : 'Open country';
}
const DIRS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
function compass(dir) {
  const i = Math.round((((dir % 360) + 360) % 360) / 22.5) % 16;
  return DIRS[i];
}
function heroFor(field, lon, lat) {
  const s = observe(lon, lat);
  s.precip = precipOf(lon, lat, s.cells);
  if (!field) return { n: String(Math.round(s.temp)), u: '°F', s: s };
  if (field === 'reflectivity') return { n: s.refl < 8 ? '< 5' : String(Math.round(s.refl)), u: 'dBZ', s: s };
  if (field === 'velocity') return { n: String(Math.round(s.vel)), u: 'kt', s: s };
  if (field === 'temperature') return { n: String(Math.round(s.temp)), u: '°F', s: s };
  if (field === 'dewpoint') return { n: String(Math.round(s.dew)), u: '°F', s: s };
  if (field === 'wind') return { n: String(Math.round(s.spd)), u: 'kt', s: s };
  if (field === 'cape') return { n: Math.round(s.cape).toLocaleString('en-US'), u: 'J/kg', s: s };
  if (field === 'precip') return { n: s.precip.toFixed(2), u: 'in', s: s };
  if (field === 'pressure') return { n: String(Math.round(s.pres)), u: 'mb', s: s };
  if (field === 'ir' || field === 'wv' || field === 'vis') return { n: String(Math.round(-18 - s.cloud * 58)), u: '°C', s: s };
  const kind = field === 'visibility' ? 'visibility' : field;
  const v = chaseOf(kind, lon, lat, s.cells, s);
  return { n: v.toFixed(1), u: field === 'visibility' ? 'mi' : '', s: s };
}
function metaFor(field, s) {
  const lines = [];
  const bits = [];
  if (field !== 'temperature') bits.push(Math.round(s.temp) + '°F');
  if (field !== 'dewpoint') bits.push('dewpoint ' + Math.round(s.dew) + '°F');
  if (bits.length) lines.push(bits.join(' · '));
  lines.push(compass(s.dir) + ' ' + Math.round(s.spd) + ' kt');
  if (field !== 'cape' && s.cape >= 200) lines.push('CAPE ' + Math.round(s.cape).toLocaleString('en-US'));
  return lines;
}

function renderChrome() {
  const c = clock(state.validMinute);
  document.getElementById('plateTime').innerHTML = c.hh + ':' + c.mm + '<span>UTC</span>';
  document.getElementById('plateCaption').textContent = caption(c);
  const times = timeline();
  const index = Math.max(0, times.indexOf(state.validMinute));
  const scrub = document.getElementById('scrub');
  scrub.max = String(times.length - 1);
  scrub.value = String(index);
  const pct = times.length === 1 ? 100 : (index / (times.length - 1)) * 100;
  scrub.style.setProperty('--p', pct + '%');
  const labelBox = document.getElementById('trackLabels');
  labelBox.replaceChildren();
  [0, 0.33, 0.66, 1].forEach(function (u) {
    const t = times[Math.round(u * (times.length - 1))];
    const k = clock(t);
    const span = document.createElement('span');
    span.textContent = k.hh + ':' + k.mm;
    labelBox.appendChild(span);
  });
  const field = activeField();
  const legend = LEGENDS[field] || { min: '', max: '', plain: true };
  document.getElementById('legendMin').textContent = legend.min || '';
  document.getElementById('legendMax').textContent = legend.max || '';
  const legendEl = document.getElementById('legend');
  legendEl.classList.toggle('is-plain', !field || legend.plain);
  if (legend.bar) document.getElementById('legendBar').style.setProperty('--bar', legend.bar);
  renderWarningList();
  updateLive();
  if (state.pinned) fillPin(state.pinned.lon, state.pinned.lat);
}
function caption(c) {
  const date = c.day === 14 ? '' : ' · ' + c.day + ' Oct';
  if (state.mode === 'now') return 'Central composite · Reflectivity' + date;
  if (state.mode === 'radar') {
    const product = state.radarProduct === 'velocity' ? 'Velocity' : 'Reflectivity';
    return SITES[state.site].name.split(' · ')[0] + ' · ' + product + ' · ' + state.tilt + '°' + date;
  }
  if (state.mode === 'satellite') {
    const names = { ir: 'Infrared', wv: 'Water vapor', vis: 'Visible' };
    const domain = state.domain === 'meso' ? 'Mesoscale' : 'CONUS';
    return 'GOES-19 · ' + names[state.satProduct] + ' · ' + domain + date;
  }
  const fHour = Math.round((state.validMinute - (state.runHour - 12) * 60) / 60);
  return MODELS[state.model] + ' ' + String(state.runHour).padStart(2, '0') + 'Z · ' + FIELDS[state.field] + ' · F' + String(fHour).padStart(2, '0') + date;
}
function renderWarningList() {
  const list = document.getElementById('warningList');
  list.replaceChildren();
  if (!state.layers.warnings) {
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent = 'Warnings are hidden.';
    list.appendChild(p);
    return;
  }
  WARNINGS.forEach(function (w) {
    const expired = state.validMinute > w.expire;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'warning' + (expired ? ' is-expired' : '');
    btn.style.setProperty('--c', w.color);
    btn.setAttribute('aria-current', state.focusWarning === w.id ? 'true' : 'false');
    const when = clock(w.expire);
    const b = document.createElement('b');
    b.textContent = w.name;
    const span = document.createElement('span');
    span.textContent = expired ? w.place + ' · expired' : w.place + ' · until ' + when.hh + ':' + when.mm + ' UTC';
    btn.append(b, span);
    btn.addEventListener('click', function () { focusWarning(w); });
    li.appendChild(btn);
    list.appendChild(li);
  });
}
function updateLive() {
  const ll = hoverLL || state.pinned || { lon: -97.9, lat: 38.2 };
  const hero = heroFor(activeField(), ll.lon, ll.lat);
  document.getElementById('liveValue').textContent = hero.u ? hero.n + ' ' + hero.u : hero.n;
  document.getElementById('livePlace').textContent = placeName(ll.lon, ll.lat);
}
function fillPin(lon, lat) {
  const hero = heroFor(activeField(), lon, lat);
  document.getElementById('pinPlace').textContent = placeName(lon, lat);
  const ns = lat >= 0 ? 'N' : 'S';
  const ew = lon < 0 ? 'W' : 'E';
  document.getElementById('pinCoord').textContent = Math.abs(lat).toFixed(2) + '°' + ns + '  ' + Math.abs(lon).toFixed(2) + '°' + ew;
  document.getElementById('pinValue').textContent = hero.n;
  document.getElementById('pinUnit').textContent = hero.u;
  const meta = document.getElementById('pinMeta');
  meta.replaceChildren();
  metaFor(activeField(), hero.s).forEach(function (line) {
    const div = document.createElement('div');
    div.textContent = line;
    meta.appendChild(div);
  });
}
function openPin(lon, lat, clientX, clientY) {
  state.pinned = { lon: lon, lat: lat };
  const pin = document.getElementById('pin');
  pin.hidden = false;
  fillPin(lon, lat);
  const rect = mapEl.getBoundingClientRect();
  let x = (clientX != null ? clientX - rect.left : rect.width / 2) + 14;
  let y = (clientY != null ? clientY - rect.top : rect.height / 2) - 40;
  const w = pin.offsetWidth || 214;
  const h = pin.offsetHeight || 150;
  if (x + w > rect.width - 12) x -= w + 28;
  y = Math.max(12, Math.min(rect.height - h - 86, y));
  x = Math.max(12, x);
  pin.style.left = x + 'px';
  pin.style.top = y + 'px';
  updateLive();
}
function closePin() {
  state.pinned = null;
  document.getElementById('pin').hidden = true;
  updateLive();
}
function focusWarning(w) {
  state.focusWarning = w.id;
  if (!state.layers.warnings) {
    state.layers.warnings = true;
    document.querySelector('[data-layer="warnings"]').setAttribute('aria-pressed', 'true');
  }
  if (state.mode !== 'now') setMode('now');
  let lon = 0, lat = 0;
  w.ring.forEach(function (p) { lon += p[0]; lat += p[1]; });
  lon /= w.ring.length;
  lat /= w.ring.length;
  const [x, y] = project(lon, lat);
  const pt = chart.createSVGPoint();
  pt.x = x;
  pt.y = y;
  const ctm = chart.getScreenCTM();
  const screen = ctm ? pt.matrixTransform(ctm) : null;
  renderOverlays();
  renderWarningList();
  openPin(lon, lat, screen ? screen.x : null, screen ? screen.y : null);
}

function desiredView() {
  if (state.mode === 'radar') {
    const site = SITES[state.site];
    return viewFor(site.lon, site.lat, 9.2);
  }
  if (state.mode === 'satellite' && state.domain === 'meso') {
    const s = stormState()[0];
    return viewFor(s.lon, s.lat, 14);
  }
  return [0, 0, GEO.w, GEO.h];
}
function viewFor(lon, lat, lonSpan) {
  const center = project(lon, lat);
  let w = (lonSpan / (GEO.lon1 - GEO.lon0)) * GEO.w;
  const aspect = (mapEl.clientWidth || 1) / (mapEl.clientHeight || 1);
  let h = w / aspect;
  if (w >= GEO.w || h >= GEO.h) return [0, 0, GEO.w, GEO.h];
  let x = center[0] - w / 2;
  let y = center[1] - h / 2;
  x = Math.max(0, Math.min(GEO.w - w, x));
  y = Math.max(0, Math.min(GEO.h - h, y));
  return [x, y, w, h];
}
let viewFrame = 0;
function setView(target, animate) {
  cancelAnimationFrame(viewFrame);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!animate || reduce) {
    view = target.slice();
    applyView();
    return;
  }
  const from = view.slice();
  const t0 = performance.now();
  function step(now) {
    const u = Math.min(1, (now - t0) / 280);
    const e = 1 - Math.pow(1 - u, 3);
    view = from.map(function (v, i) { return v + (target[i] - v) * e; });
    applyView();
    if (u < 1) viewFrame = requestAnimationFrame(step);
  }
  viewFrame = requestAnimationFrame(step);
}
function applyView() {
  chart.setAttribute('viewBox', view.map(function (n) { return n.toFixed(2); }).join(' '));
  renderOverlays();
}

function onTimeChange() {
  renderField();
  renderChrome();
  renderOverlays();
}
function stepTime(dir) {
  const times = timeline();
  let i = times.indexOf(state.validMinute);
  if (i < 0) i = 0;
  i = (i + dir + times.length) % times.length;
  state.validMinute = times[i];
  onTimeChange();
}
function setPlaying(on) {
  state.playing = on;
  const btn = document.getElementById('play');
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  btn.setAttribute('aria-label', on ? 'Pause' : 'Play');
  btn.innerHTML = on
    ? '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg>'
    : '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l8-4.5z" fill="currentColor"/></svg>';
  clearInterval(playTimer);
  if (on) playTimer = setInterval(function () { stepTime(1); }, 850);
}
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('[role="tab"]').forEach(function (tab) {
    const on = tab.dataset.mode === mode;
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll('[data-panel]').forEach(function (panel) {
    panel.hidden = panel.dataset.panel !== mode;
  });
  mapEl.classList.toggle('is-satellite', mode === 'satellite');
  snapValid();
  renderField();
  renderChrome();
  setView(desiredView(), true);
  if (window.innerWidth <= 860) closeSheet();
}
function closeSheet() {
  stage.classList.remove('sheet-open');
  document.getElementById('sheetToggle').setAttribute('aria-expanded', 'false');
}
function pointerLL(event) {
  const pt = chart.createSVGPoint();
  pt.x = event.clientX;
  pt.y = event.clientY;
  const ctm = chart.getScreenCTM();
  if (!ctm) return null;
  const p = pt.matrixTransform(ctm.inverse());
  return unproject(p.x, p.y);
}

document.querySelectorAll('[role="tab"]').forEach(function (tab) {
  tab.addEventListener('click', function () { setMode(tab.dataset.mode); });
});
document.getElementById('warnChip').addEventListener('click', function () {
  state.layers.warnings = true;
  document.querySelector('[data-layer="warnings"]').setAttribute('aria-pressed', 'true');
  setMode('now');
});
document.getElementById('sheetToggle').addEventListener('click', function () {
  const open = !stage.classList.contains('sheet-open');
  stage.classList.toggle('sheet-open', open);
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
});
document.getElementById('scrim').addEventListener('click', closeSheet);
document.querySelectorAll('.switch').forEach(function (btn) {
  btn.addEventListener('click', function () {
    const key = btn.dataset.layer;
    state.layers[key] = !state.layers[key];
    btn.setAttribute('aria-pressed', state.layers[key] ? 'true' : 'false');
    if (key === 'warnings' && !state.layers.warnings) state.focusWarning = null;
    renderField();
    renderChrome();
    renderOverlays();
  });
});
document.getElementById('siteSelect').addEventListener('change', function (e) {
  state.site = e.target.value;
  renderField();
  setView(desiredView(), true);
});
document.querySelectorAll('[data-radar]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    state.radarProduct = btn.dataset.radar;
    document.querySelectorAll('[data-radar]').forEach(function (b) {
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    onTimeChange();
  });
});
document.getElementById('tiltSeg').addEventListener('click', function (e) {
  const btn = e.target.closest('[data-tilt]');
  if (!btn) return;
  state.tilt = Number(btn.dataset.tilt);
  document.querySelectorAll('[data-tilt]').forEach(function (b) {
    b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
  });
  onTimeChange();
});
document.getElementById('loopSeg').addEventListener('click', function (e) {
  const btn = e.target.closest('[data-loop]');
  if (!btn) return;
  state.loop = Number(btn.dataset.loop);
  document.querySelectorAll('[data-loop]').forEach(function (b) {
    b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
  });
  snapValid();
  onTimeChange();
});
document.getElementById('modelSelect').addEventListener('change', function (e) {
  state.model = e.target.value;
  onTimeChange();
});
document.getElementById('runSelect').addEventListener('change', function (e) {
  state.runHour = Number(e.target.value);
  snapValid();
  onTimeChange();
});
function selectField(field) {
  state.field = field;
  document.querySelectorAll('[data-field]').forEach(function (btn) {
    btn.setAttribute('aria-pressed', btn.dataset.field === field ? 'true' : 'false');
  });
  onTimeChange();
}
document.querySelectorAll('[data-field]').forEach(function (btn) {
  btn.addEventListener('click', function () { selectField(btn.dataset.field); });
});
document.getElementById('chaseToggle').addEventListener('click', function () {
  const open = this.getAttribute('aria-expanded') !== 'true';
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
  document.getElementById('chaseFields').hidden = !open;
});
document.getElementById('fieldSearch').addEventListener('input', function (e) {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('#modelFields .choice, #chaseFields .choice').forEach(function (btn) {
    const match = !q || btn.textContent.toLowerCase().indexOf(q) !== -1;
    btn.hidden = !match;
    if (match) shown += 1;
  });
  const chase = document.getElementById('chaseFields');
  const toggle = document.getElementById('chaseToggle');
  if (q) {
    const any = Array.from(chase.querySelectorAll('.choice')).some(function (btn) { return !btn.hidden; });
    chase.hidden = !any;
    toggle.hidden = !any;
  } else {
    toggle.hidden = false;
    chase.hidden = toggle.getAttribute('aria-expanded') !== 'true';
  }
  document.getElementById('fieldEmpty').hidden = shown !== 0;
});
document.querySelectorAll('[data-sat]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    state.satProduct = btn.dataset.sat;
    document.querySelectorAll('[data-sat]').forEach(function (b) {
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    onTimeChange();
  });
});
document.getElementById('domainSeg').addEventListener('click', function (e) {
  const btn = e.target.closest('[data-domain]');
  if (!btn) return;
  state.domain = btn.dataset.domain;
  document.querySelectorAll('[data-domain]').forEach(function (b) {
    b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
  });
  renderField();
  renderChrome();
  setView(desiredView(), true);
});
document.getElementById('play').addEventListener('click', function () { setPlaying(!state.playing); });
document.getElementById('scrub').addEventListener('input', function (e) {
  setPlaying(false);
  const times = timeline();
  state.validMinute = times[Number(e.target.value)] || times[0];
  onTimeChange();
});
document.getElementById('pinClose').addEventListener('click', closePin);
chart.addEventListener('pointermove', function (e) {
  const ll = pointerLL(e);
  if (!ll || !isLand(ll.lon, ll.lat)) {
    hoverLL = null;
  } else {
    hoverLL = ll;
  }
  updateLive();
});
chart.addEventListener('pointerleave', function () {
  hoverLL = null;
  updateLive();
});
chart.addEventListener('click', function (e) {
  const hit = e.target.closest && e.target.closest('[data-warning]');
  if (hit) {
    const w = WARNINGS.find(function (item) { return item.id === hit.getAttribute('data-warning'); });
    if (w) focusWarning(w);
    return;
  }
  const ll = pointerLL(e);
  if (!ll || !isLand(ll.lon, ll.lat)) return;
  state.focusWarning = null;
  renderWarningList();
  renderOverlays();
  openPin(ll.lon, ll.lat, e.clientX, e.clientY);
});
document.addEventListener('keydown', function (e) {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!state.playing); }
  if (e.key === 'Escape') { closePin(); closeSheet(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    setPlaying(false);
    stepTime(e.key === 'ArrowRight' ? 1 : -1);
  }
});
window.addEventListener('resize', function () {
  setView(desiredView(), false);
});

buildChart();
renderField();
renderChrome();
setView(desiredView(), false);
</script>
</body>
