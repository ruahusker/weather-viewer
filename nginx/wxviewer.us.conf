# wxviewer.us — the weather viewer at the domain root.
# Copy of /etc/nginx/sites-available/wxviewer.us (symlinked into
# sites-enabled). HTTPS: Let's Encrypt via `certbot --nginx` for wxviewer.us
# and www.wxviewer.us (one certificate, renewed by certbot.timer). Lines marked
# "managed by Certbot" are certbot's. Both names serve the site as typed; the
# HTTP -> HTTPS redirect keeps www. when it was used.
#
# The app works from "/" (paths are root-relative; mobile.js and core/api.js
# only prefix /wx when the page itself is under /wx/). The /wx/... routes are
# kept so shared vibeprojects.us links (/wx/monitor, /wx/radar-map-3d, ...)
# work here too.

server {
    server_name wxviewer.us www.wxviewer.us;
    access_log /var/log/nginx/wxviewer.access.log;

    # /wx/ (FastAPI picks desktop or phone), mutable rendered assets, 3D radar map.
    include /home/main/weather-viewer/nginx/wx-site-routes.conf;

    # Viewer at the root: FastAPI serves index.html or mobile.html by user agent.
    location = / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /monitor { return 301 /wx/monitor; }

    location /rendered/ {
        alias /home/main/weather-viewer/data/rendered/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    location /static/ {
        alias /home/main/weather-viewer/web/static/;
        expires 1h;
        gzip on;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30;
        gzip on;
        gzip_types application/json;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # --- /wx/ routes, same as on vibeprojects.us ---
    location /wx/static/ {
        alias /home/main/weather-viewer/web/static/;
        expires 1h;
        gzip on;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /wx/radar-3d {
        proxy_pass http://127.0.0.1:8000/wx/radar-3d;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wx/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30;
        gzip on;
        gzip_types application/json;
    }

    location /wx/rendered/ {
        alias /home/main/weather-viewer/data/rendered/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /wx {
        return 301 /wx/;
    }

    location = /wx/mobile.html {
        alias /home/main/weather-viewer/web/static/mobile.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /wx/static/sw.js {
        alias /home/main/weather-viewer/web/static/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/wx/";
    }

    location = /wx/monitor {
        proxy_pass http://127.0.0.1:8000/wx/monitor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /wx/ {
        alias /home/main/weather-viewer/web/static/;
        index index.html;
    }

    # Root-level pages the viewer links to (e.g. /privacy.html).
    location / {
        root /home/main/weather-viewer/web/static;
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wxviewer.us/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wxviewer.us/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.wxviewer.us) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = wxviewer.us) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wxviewer.us www.wxviewer.us;
    return 404; # managed by Certbot




}
