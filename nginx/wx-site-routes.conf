# Include inside the server block that serves the /wx/ deployment.
# Let FastAPI choose the phone/desktop page and honor shared links and cookies.
location = /wx/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Compress vector wind images without recompressing PNG or radar imagery.
location ~ "^/(?:wx/)?rendered/(?<wx_wind_svg>[a-z0-9_]+/[0-9]{10}/wind_[a-z0-9_]+/f[0-9]+\.wind\.svg)$" {
    alias /home/main/weather-viewer/data/rendered/$wx_wind_svg;
    gzip on;
    gzip_types image/svg+xml;
    gzip_vary on;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin "*";
}

# Run metadata and latest pointers change in place; dated images stay cached.
location ~ ^/(?:wx/)?rendered/(?<wx_mutable_asset>.+(?:\.json|_latest\.png))$ {
    alias /home/main/weather-viewer/data/rendered/$wx_mutable_asset;
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*";
}

# Live regional volumetric radar map (Omaha and Hastings).
location = /wx/radar-map-3d {
    proxy_pass http://127.0.0.1:8000/wx/radar-map-3d;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
}
