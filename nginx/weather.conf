server {
    listen 80;
    server_name _;

    # Rendered images — served directly, no Python involved
    location /rendered/ {
        alias /home/main/weather-viewer/data/rendered/;
        expires 1h;
        gzip on;
        gzip_types application/json image/svg+xml;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # Static web assets
    location /static/ {
        alias /home/main/weather-viewer/web/static/;
        expires 1h;
        gzip on;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # API — proxy to uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30;
        gzip on;
        gzip_types application/json;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # Pipeline monitor dashboard
    location = /wx/monitor {
        alias /home/main/weather-viewer/web/static/dashboard.html;
    }
    location = /wx/monitor/ {
        alias /home/main/weather-viewer/web/static/dashboard.html;
    }

    # SPA fallback
    location / {
        root /home/main/weather-viewer/web/static;
        try_files $uri /index.html;
    }
}
